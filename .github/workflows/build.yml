name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # vollständige Historie für Build-Nummer und Tags

      - name: Determine version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($VERSION)"
              exit 1
            fi
            LABEL="$VERSION"
          else
            LABEL="$VERSION-dev.$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION ($LABEL)"

      - name: Build app
        env:
          HARDTERM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Package
        run: |
          ZIP="Hardterm-${{ steps.version.outputs.label }}-macOS-arm64.zip"
          ditto -c -k --keepParent build/Hardterm.app "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Hardterm-${{ steps.version.outputs.label }}
          path: ${{ env.ZIP }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "Hardterm $GITHUB_REF_NAME" \
            --generate-notes
